# Quarkus Configuration

# Datasource Configuration (replacing JNDI lookup)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgresUser
quarkus.datasource.password=postgresPW
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgresDB

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Flyway Migration Settings
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# OIDC Configuration for Keycloak
quarkus.oidc.auth-server-url=http://localhost:8081/realms/coolstore
quarkus.oidc.client-id=coolstore-app
quarkus.oidc.credentials.secret=secret
quarkus.oidc.application-type=web-app

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:8080,http://localhost:4200

# Static Resources
quarkus.http.enable-compression=true

# SmallRye Reactive Messaging - In-Memory Connector
mp.messaging.outgoing.orders.connector=smallrye-in-memory
mp.messaging.incoming.orders.connector=smallrye-in-memory
