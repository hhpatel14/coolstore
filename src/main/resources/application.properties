# Datasource configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRESQL_USER:coolstore}
quarkus.datasource.password=${POSTGRESQL_PASSWORD:coolstore123}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRESQL_SERVICE_HOST:localhost}:${POSTGRESQL_SERVICE_PORT:5432}/${POSTGRESQL_DATABASE:coolstore}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.database.default-schema=public

# JPA configuration
quarkus.jpa.properties.hibernate.format_sql=true
quarkus.jpa.properties.hibernate.use_sql_comments=true
quarkus.jpa.properties.hibernate.jdbc.use_get_generated_keys=false

# HTTP configuration
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-max-age=24H

# Cloud-native configuration
quarkus.http.root-path=/services

# Hibernate ORM configuration
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.log.jdbc-warning=true 