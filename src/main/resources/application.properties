# HTTP port configuration
quarkus.http.port=8080

# Datasource configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore
quarkus.datasource.jdbc.driver=org.h2.Driver

# Hibernate configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Flyway configuration
quarkus.flyway.migrate-at-start=true

# Reactive Messaging - In-memory connector for orders channel
# Note: in-memory connector doesn't need explicit configuration
# The channel is automatically bridged when using @Channel and @Incoming with same name
